name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Backend/src
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OrganizationalStructure.slnx

      - name: Build
        run: dotnet build OrganizationalStructure.slnx --configuration Release --no-restore

      - name: Unit Tests (Domain)
        run: dotnet test ../tests/OrganizationalStructure.Domain.UnitTests --configuration Release --no-build --logger "trx;LogFileName=domain-unit.trx"

      - name: Unit Tests (Application)
        run: dotnet test ../tests/OrganizationalStructure.Application.UnitTests --configuration Release --no-build --logger "trx;LogFileName=application-unit.trx"

      - name: Unit Tests (Infrastructure)
        run: dotnet test ../tests/OrganizationalStructure.Infrastructure.UnitTests --configuration Release --no-build --logger "trx;LogFileName=infrastructure-unit.trx"

      - name: Architecture Tests (Fitness Functions)
        run: dotnet test ../tests/OrganizationalStructure.ArchitectureTests --configuration Release --no-build --logger "trx;LogFileName=architecture.trx"

      - name: Integration Tests (LocalDB)
        run: dotnet test ../tests/OrganizationalStructure.Api.IntegrationTests --configuration Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Vulnerability Scan (Backend)
        run: dotnet list OrganizationalStructure.slnx package --vulnerable --include-transitive

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'

  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency Audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
